[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cql-engine-python"
version = "0.1.0"
description = "Python port scaffold for the CQL Engine"
readme = "python/README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "CQL Engine Contributors"}]

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
include = ["cql_engine*"]
