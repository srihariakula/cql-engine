[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "cql-engine"
version = "2.5.0"
description = "Python implementation of the HL7 Clinical Quality Language (CQL) evaluation engine"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [
    {name = "CQL Engine Contributors"},
]
keywords = ["cql", "clinical-quality-language", "hl7", "fhir", "healthcare", "elm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Typing :: Typed",
]

dependencies = []

[project.optional-dependencies]
fhir = ["requests>=2.28.0"]
xml = ["lxml>=4.9.0"]
all = ["requests>=2.28.0", "lxml>=4.9.0"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "mypy>=1.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/srihariakula/cql-engine"
Repository = "https://github.com/srihariakula/cql-engine"

[tool.setuptools.packages.find]
include = ["cql_engine*"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
